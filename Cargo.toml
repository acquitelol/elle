[package]
name = "ellec"
version = "0.50.4"
edition = "2021"
license = "GPL-3.0+"
repository = "https://github.com/acquitelol/elle"
keywords = ["language", "compiler", "lsp", "qbe"]
categories = ["compilers"]

[profile.release]
opt-level = 3

[build-dependencies]
chrono = "0.4"

[dependencies]
levenshtein = "1.0.5"
codegen = { path = "codegen" }
tower-lsp = "0.20.0"
tokio = { version = "1.44.2", features = ["full"] }
anyhow = "1.0.98"
string-interner = "0.19.0"
